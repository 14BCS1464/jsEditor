<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JavaScript MCQ Quiz</title>
  
  <!-- Open Graph Meta Tags for LinkedIn/Social Media -->
  <meta property="og:title" content="JavaScript MCQ Quiz - Test Your JS Skills" />
  <meta property="og:description" content="Challenge yourself with JavaScript multiple choice questions and improve your coding skills!" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thejseditors.com" />
  <meta property="og:image" content="https://www.digitalclassworld.com/blog/wp-content/uploads/2021/02/Full-form-of-URL-1.jpg" />
  <meta property="og:site_name" content="JavaScript MCQ Quiz" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=explain-right" />
  <link rel="stylesheet" href="../shared/chrome.css?v=mcq-dark">
</head>

<body class="suite suite-mcq">
  <header class="suite-header">
    <a class="suite-logo" href="../">js.zero2hero</a>
    <div class="suite-title"><strong>JavaScript</strong><span>MCQ</span></div>
    <div class="suite-actions">
      <button type="button" class="suite-btn" data-suite-theme onclick="suiteToggleTheme()" title="Dark or light"><i class="fa-solid fa-moon"></i><span>Dark</span></button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <header>
        <div class="brand">JS MCQ Quiz</div>
        <div class="meta">
          <span id="counter">Q 1/1</span>
          <div class="progress">
            <div id="bar"></div>
          </div>
          <span class="pill" id="score">Score: 0</span>
        </div>
      </header>
      <main>
        <div class="quiz-layout">
          <div class="quiz-main">
        <div class="qtext" id="qtext"></div>
        <div class="editor hidden" id="qcode"></div>
        <div class="options" id="options"></div>
        <div class="controls">
          <div class="left">
            <button id="prevBtn">Prev</button>
            <button id="skipBtn">Skip</button>
          </div>
          <div class="right">
            <button id="checkBtn" class="primary">Check</button>
            <button id="nextBtn">Next</button>
            <button id="finishBtn">Finish</button>
          </div>
        </div>
        <div class="result" id="result"></div>
          </div>
          <aside class="explain-pane idle" id="feedback">
            <div class="explain-kicker">Explanation</div>
            <div class="explain-status" id="explainStatus">Choose an answer, then press Check. The explanation stays on this side.</div>
            <div class="explain-body" id="explainBody"></div>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <!-- Score Popup Modal -->
  <div id="scoreModal" class="modal">
    <div class="modal-content" id="modalContent">
      <div class="modal-header">
        <div class="score-icon" id="scoreIcon"></div>
        <h2 id="modalTitle"></h2>
      </div>
      <div class="modal-body">
        <div class="score-display" id="modalScore"></div>
        <p id="modalMessage"></p>
        <div class="modal-buttons">
          <button class="modal-btn btn-primary" id="retryBtn">🔄 Try Again</button>
          <button class="modal-btn btn-secondary" id="homeBtn">🏠 Home</button>
          <button class="modal-btn btn-neutral" id="reviewBtn">📋 Review</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js?v=explain-left"></script>
</body>

</html>
