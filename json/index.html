<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Client + JSON Editor</title>
  <style>
    :root, .dark {
      --bg1: #0a0e27; --bg2: #020308; --glass: rgba(255,255,255,0.05);
      --border: rgba(255,255,255,0.12); --text: #e5e7eb; --muted: #9ca3af;
      --accent: #8b5cf6; --accent2: #a78bfa; --success: #10b981; --error: #ef4444;
      --input: rgba(255,255,255,0.06); --json-key: #7dd3fc; --json-str: #86efac;
      --json-num: #fdba74; --json-bool: #fcd34d; --json-null: #f87171;
    }
    .light {
      --bg1: #f8fafc; --bg2: #e2e8f0; --glass: rgba(255,255,255,0.9);
      --border: rgba(0,0,0,0.1); --text: #1e293b; --muted: #64748b;
      --accent: #7c3aed; --accent2: #6d28d9; --success: #059669; --error: #dc2626;
      --input: rgba(0,0,0,0.04); --json-key: #0369a1; --json-str: #15803d;
      --json-num: #c2410c; --json-bool: #a16207; --json-null: #b91c1c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .topbar {
      display: flex; gap: 8px; padding: 12px 16px; background: var(--glass);
      border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap;
    }
    select, input, button, textarea {
      font-family: inherit; font-size: 13px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--input); color: var(--text); padding: 9px 12px;
    }
    select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    button {
      background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white;
      border: none; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    button.secondary { background: var(--input); color: var(--text); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #method { font-weight: 800; min-width: 100px; }
    #method.GET { color: #10b981; } #method.POST { color: #f59e0b; }
    #method.PUT { color: #38bdf8; } #method.PATCH { color: #a78bfa; } #method.DELETE { color: #ef4444; }
    #url { flex: 1; min-width: 220px; font-family: ui-monospace, monospace; }
    .main { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 240px; border-right: 1px solid var(--border); background: var(--glass);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar h3 { padding: 12px 14px; font-size: 11px; text-transform: uppercase; color: var(--muted); }
    .sidebar .item {
      padding: 8px 14px; font-size: 12.5px; cursor: pointer; border-left: 3px solid transparent;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar .item:hover, .sidebar .item.active { background: rgba(139,92,246,0.12); border-left-color: var(--accent); }
    .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
    .tab-panel { display: none; flex: 1; overflow: auto; padding: 12px; }
    .tab-panel.active { display: flex; flex-direction: column; }
    .kv-row { display: grid; grid-template-columns: 20px 1fr 1fr 28px; gap: 6px; margin-bottom: 6px; align-items: center; }
    .kv-row input[type="text"] { width: 100%; font-family: ui-monospace, monospace; font-size: 12.5px; }
    .kv-row input.key { color: var(--json-key); }
    .remove { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 14px; }
    .remove:hover { color: var(--error); }
    textarea { flex: 1; resize: none; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.5; }
    .response-area { flex: 1; display: flex; flex-direction: column; border-top: 1px solid var(--border); min-height: 0; }
    .resp-header {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 14px;
      background: rgba(139,92,246,0.08); border-bottom: 1px solid var(--border); font-size: 12px;
    }
    .pills { display: flex; gap: 8px; }
    .pill { padding: 3px 10px; border-radius: 20px; background: var(--input); font-weight: 600; }
    .status-2xx { color: var(--success); } .status-4xx, .status-err { color: var(--error); }
    #output {
      flex: 1; overflow: auto; padding: 14px; font-family: ui-monospace, monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-word;
    }
    .json-key { color: var(--json-key); } .json-string { color: var(--json-str); }
    .json-number { color: var(--json-num); } .json-boolean { color: var(--json-bool); }
    .json-null { color: var(--json-null); }
    .toggle { cursor: pointer; font-weight: 700; color: var(--accent2); user-select: none; }
    .toggle .arrow { display: inline-block; transition: transform .15s; font-size: 10px; margin-right: 4px; }
    .toggle.collapsed .arrow { transform: rotate(-90deg); }
    .node { margin-left: 6px; padding-left: 12px; border-left: 2px solid rgba(139,92,246,0.25); }
    .toggle.collapsed + .node { display: none; }
    .status-bar { padding: 8px; text-align: center; font-size: 12px; border-top: 1px solid var(--border); background: var(--glass); }
    .status-bar.ok { color: var(--success); } .status-bar.err { color: var(--error); }
    .env-bar { display: flex; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); align-items: center; }
    .auth-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .auth-row select, .auth-row input { flex: 1; }
  </style>
</head>
<body class="dark">
  <div class="topbar">
    <select id="method" class="GET">
      <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
    </select>
    <input id="url" type="text" placeholder="https://api.example.com/users or {{baseUrl}}/users" value="https://dummyjson.com/products" />
    <button id="sendBtn" onclick="send()">Send</button>
    <button class="secondary" onclick="beautify()">Beautify</button>
    <button class="secondary" onclick="minify()">Minify</button>
    <button class="secondary" onclick="toggleTheme()" id="themeBtn">🌙</button>
  </div>

  <div class="main">
    <!-- Sidebar: History + Collections -->
    <div class="sidebar">
      <h3>History</h3>
      <div id="historyList" style="flex:1; overflow:auto;"></div>
      <h3>Collections</h3>
      <div id="collectionList" style="overflow:auto; max-height:180px;"></div>
      <div style="padding:10px;">
        <button class="secondary" style="width:100%;" onclick="saveCurrent()">Save Request</button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="content">
      <div class="env-bar">
        <select id="envSelect" onchange="applyEnv()" style="min-width:140px;">
          <option value="">No Environment</option>
        </select>
        <button class="secondary" onclick="manageEnvs()">Manage Envs</button>
        <span style="font-size:12px; color:var(--muted);">Use {{varName}} in URL / Headers / Body</span>
      </div>

      <div class="tabs">
        <div class="tab active" data-tab="params">Params</div>
        <div class="tab" data-tab="headers">Headers</div>
        <div class="tab" data-tab="auth">Auth</div>
        <div class="tab" data-tab="body">Body</div>
      </div>

      <div class="tab-panel active" data-tab="params">
        <div id="paramsTable"></div>
      </div>
      <div class="tab-panel" data-tab="headers">
        <div id="headersTable"></div>
      </div>
      <div class="tab-panel" data-tab="auth">
        <div class="auth-row">
          <select id="authType" onchange="updateAuthUI()">
            <option value="none">No Auth</option>
            <option value="bearer">Bearer Token</option>
            <option value="basic">Basic Auth</option>
            <option value="apikey">API Key</option>
          </select>
        </div>
        <div id="authFields"></div>
      </div>
      <div class="tab-panel" data-tab="body">
        <textarea id="body" placeholder='{"name": "John"}'></textarea>
      </div>

      <!-- Response -->
      <div class="response-area">
        <div class="resp-header">
          <div class="pills">
            <span class="pill" id="respStatus">—</span>
            <span class="pill" id="respTime">—</span>
            <span class="pill" id="respSize">—</span>
          </div>
          <div>
            <button class="secondary" style="padding:4px 10px; font-size:11px;" onclick="setView('tree')">Tree</button>
            <button class="secondary" style="padding:4px 10px; font-size:11px;" onclick="setView('raw')">Raw</button>
          </div>
        </div>
        <div id="output">Enter a URL and click <b>Send</b></div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status">Ready</div>

<script>
  // ---------- STATE ----------
  let history = JSON.parse(localStorage.getItem('api_history') || '[]');
  let collections = JSON.parse(localStorage.getItem('api_collections') || '[]');
  let environments = JSON.parse(localStorage.getItem('api_envs') || '{}');
  let currentEnv = localStorage.getItem('api_current_env') || '';
  let lastResponse = null;
  let viewMode = 'tree';

  // ---------- INIT ----------
  function init() {
    createKv('paramsTable', 'params');
    createKv('headersTable', 'headers', [['Content-Type', 'application/json']]);
    renderHistory();
    renderCollections();
    renderEnvSelect();
    updateAuthUI();
    document.getElementById('method').onchange = e => e.target.className = e.target.value;
    document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.querySelector(`.tab-panel[data-tab="${t.dataset.tab}"]`).classList.add('active');
    });
  }

  // ---------- KV MANAGER ----------
  function createKv(id, type, defaults = []) {
    const box = document.getElementById(id);
    box.innerHTML = '';
    function add(k = '', v = '') {
      const row = document.createElement('div');
      row.className = 'kv-row';
      row.innerHTML = `
        <input type="checkbox" checked>
        <input class="key" type="text" placeholder="Key" value="${esc(k)}">
        <input type="text" placeholder="Value" value="${esc(v)}">
        <button class="remove">✕</button>`;
      row.querySelector('.remove').onclick = () => { row.remove(); if (!box.querySelector('.kv-row')) add(); };
      const inputs = row.querySelectorAll('input[type=text]');
      inputs.forEach(i => i.oninput = () => {
        const last = box.querySelector('.kv-row:last-child');
        if (last === row && (inputs[0].value || inputs[1].value)) add();
      });
      box.appendChild(row);
    }
    defaults.forEach(([k, v]) => add(k, v));
    add();
  }
  function getKv(id) {
    const res = [];
    document.querySelectorAll(`#${id} .kv-row`).forEach(r => {
      const [cb, k, v] = r.querySelectorAll('input');
      if (cb.checked && k.value.trim()) res.push([k.value.trim(), v.value]);
    });
    return res;
  }
  function esc(s) { return String(s).replace(/"/g, '&quot;'); }

  // ---------- VARIABLES ----------
  function resolve(str) {
    if (!str || !currentEnv || !environments[currentEnv]) return str;
    return str.replace(/\{\{(\w+)\}\}/g, (_, key) => environments[currentEnv][key] ?? `{{${key}}}`);
  }

  // ---------- AUTH ----------
  function updateAuthUI() {
    const type = document.getElementById('authType').value;
    const box = document.getElementById('authFields');
    if (type === 'none') box.innerHTML = '';
    else if (type === 'bearer') box.innerHTML = `<input id="authToken" type="text" placeholder="Token" style="width:100%;">`;
    else if (type === 'basic') box.innerHTML = `
      <input id="authUser" type="text" placeholder="Username" style="width:100%; margin-bottom:6px;">
      <input id="authPass" type="password" placeholder="Password" style="width:100%;">`;
    else if (type === 'apikey') box.innerHTML = `
      <input id="authKey" type="text" placeholder="Key name (e.g. X-API-Key)" style="width:100%; margin-bottom:6px;">
      <input id="authVal" type="text" placeholder="Key value" style="width:100%;">`;
  }

  // ---------- SEND ----------
  async function send() {
    const method = document.getElementById('method').value;
    let url = resolve(document.getElementById('url').value.trim());
    if (!url) return setStatus('Enter a URL', true);

    // params
    const params = getKv('paramsTable');
    if (params.length) {
      try {
        const u = new URL(url);
        params.forEach(([k, v]) => u.searchParams.set(k, resolve(v)));
        url = u.toString();
      } catch {
        const qs = params.map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(resolve(v))}`).join('&');
        url += (url.includes('?') ? '&' : '?') + qs;
      }
    }

    // headers
    const headers = {};
    getKv('headersTable').forEach(([k, v]) => headers[k] = resolve(v));

    // auth
    const authType = document.getElementById('authType').value;
    if (authType === 'bearer') {
      const t = document.getElementById('authToken')?.value;
      if (t) headers['Authorization'] = 'Bearer ' + resolve(t);
    } else if (authType === 'basic') {
      const u = document.getElementById('authUser')?.value || '';
      const p = document.getElementById('authPass')?.value || '';
      headers['Authorization'] = 'Basic ' + btoa(resolve(u) + ':' + resolve(p));
    } else if (authType === 'apikey') {
      const k = document.getElementById('authKey')?.value;
      const v = document.getElementById('authVal')?.value;
      if (k && v) headers[k] = resolve(v);
    }

    const opts = { method, headers };
    if (['POST', 'PUT', 'PATCH'].includes(method)) {
      const body = document.getElementById('body').value.trim();
      if (body) opts.body = resolve(body);
    }

    document.getElementById('sendBtn').disabled = true;
    setStatus('Sending...');
    const start = performance.now();

    try {
      const res = await fetch(url, opts);
      const text = await res.text();
      const time = Math.round(performance.now() - start);
      let json = null;
      try { json = JSON.parse(text); } catch {}

      lastResponse = { status: res.status, statusText: res.statusText, time, size: new Blob([text]).size, text, json, ok: res.ok };
      renderResponse();
      addHistory({ method, url, status: res.status, time });
      setStatus(`${res.status} ${res.statusText}`, !res.ok);
    } catch (e) {
      lastResponse = { status: 0, statusText: 'Error', time: Math.round(performance.now() - start), size: 0, text: e.message, json: null, ok: false };
      renderResponse();
      setStatus('Failed: ' + e.message, true);
    } finally {
      document.getElementById('sendBtn').disabled = false;
    }
  }

  function renderResponse() {
    if (!lastResponse) return;
    const s = lastResponse.status;
    document.getElementById('respStatus').textContent = s ? `${s} ${lastResponse.statusText}` : 'ERROR';
    document.getElementById('respStatus').className = 'pill ' + (s >= 200 && s < 300 ? 'status-2xx' : 'status-4xx');
    document.getElementById('respTime').textContent = lastResponse.time + ' ms';
    document.getElementById('respSize').textContent = formatBytes(lastResponse.size);
    setView(viewMode);
  }

  function setView(mode) {
    viewMode = mode;
    const out = document.getElementById('output');
    out.innerHTML = '';
    if (!lastResponse) return;
    if (mode === 'raw' || !lastResponse.json) {
      out.textContent = lastResponse.text;
      return;
    }
    buildTree(lastResponse.json, out);
  }

  function buildTree(val, parent) {
    if (val === null) { parent.innerHTML += '<span class="json-null">null</span>'; return; }
    if (typeof val !== 'object') {
      parent.innerHTML += formatVal(val);
      return;
    }
    const isArr = Array.isArray(val);
    const keys = Object.keys(val);
    const toggle = document.createElement('div');
    toggle.className = 'toggle';
    toggle.innerHTML = `<span class="arrow">▼</span>${isArr ? `Array [${keys.length}]` : `Object {${keys.length}}`}`;
    toggle.onclick = () => toggle.classList.toggle('collapsed');
    const node = document.createElement('div');
    node.className = 'node';
    keys.forEach(k => {
      const line = document.createElement('div');
      line.innerHTML = `<span class="json-key">${isArr ? k : `"${k}"`}</span>: `;
      if (val[k] !== null && typeof val[k] === 'object') buildTree(val[k], line);
      else line.innerHTML += formatVal(val[k]);
      node.appendChild(line);
    });
    parent.append(toggle, node);
  }
  function formatVal(v) {
    if (v === null) return '<span class="json-null">null</span>';
    if (typeof v === 'string') return `<span class="json-string">"${escHtml(v)}"</span>`;
    if (typeof v === 'number') return `<span class="json-number">${v}</span>`;
    if (typeof v === 'boolean') return `<span class="json-boolean">${v}</span>`;
    return String(v);
  }
  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatBytes(b) {
    if (b < 1024) return b + ' B';
    if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
    return (b/1048576).toFixed(1) + ' MB';
  }

  // ---------- HISTORY & COLLECTIONS ----------
  function addHistory(item) {
    history.unshift({ ...item, id: Date.now() });
    history = history.slice(0, 20);
    localStorage.setItem('api_history', JSON.stringify(history));
    renderHistory();
  }
  function renderHistory() {
    const box = document.getElementById('historyList');
    box.innerHTML = history.map(h => `
      <div class="item" onclick='loadHistory(${JSON.stringify(h).replace(/'/g, "\\'")})'>
        <b style="color:${methodColor(h.method)}">${h.method}</b> ${h.url.replace(/^https?:\/\//, '').slice(0, 40)}
        <div style="font-size:11px; color:var(--muted);">${h.status} • ${h.time}ms</div>
      </div>`).join('') || '<div style="padding:14px; color:var(--muted); font-size:12px;">No history yet</div>';
  }
  function loadHistory(h) {
    document.getElementById('method').value = h.method;
    document.getElementById('method').className = h.method;
    document.getElementById('url').value = h.url;
  }
  function methodColor(m) {
    return { GET: '#10b981', POST: '#f59e0b', PUT: '#38bdf8', PATCH: '#a78bfa', DELETE: '#ef4444' }[m] || '#999';
  }

  function saveCurrent() {
    const name = prompt('Request name:');
    if (!name) return;
    collections.push({
      id: Date.now(), name,
      method: document.getElementById('method').value,
      url: document.getElementById('url').value,
      body: document.getElementById('body').value
    });
    localStorage.setItem('api_collections', JSON.stringify(collections));
    renderCollections();
  }
  function renderCollections() {
    const box = document.getElementById('collectionList');
    box.innerHTML = collections.map(c => `
      <div class="item" onclick='loadCollection(${c.id})'>
        <b style="color:${methodColor(c.method)}">${c.method}</b> ${c.name}
      </div>`).join('') || '<div style="padding:14px; color:var(--muted); font-size:12px;">No saved requests</div>';
  }
  function loadCollection(id) {
    const c = collections.find(x => x.id === id);
    if (!c) return;
    document.getElementById('method').value = c.method;
    document.getElementById('method').className = c.method;
    document.getElementById('url').value = c.url;
    document.getElementById('body').value = c.body || '';
  }

  // ---------- ENVIRONMENTS ----------
  function renderEnvSelect() {
    const sel = document.getElementById('envSelect');
    sel.innerHTML = '<option value="">No Environment</option>' +
      Object.keys(environments).map(k => `<option value="${k}" ${k === currentEnv ? 'selected' : ''}>${k}</option>`).join('');
  }
  function applyEnv() {
    currentEnv = document.getElementById('envSelect').value;
    localStorage.setItem('api_current_env', currentEnv);
  }
  function manageEnvs() {
    const name = prompt('Environment name (leave empty to cancel):');
    if (!name) return;
    const vars = prompt('Variables (key=value, one per line):\nbaseUrl=https://api.example.com\ntoken=abc123');
    if (vars === null) return;
    const obj = {};
    vars.split('\n').forEach(line => {
      const [k, ...rest] = line.split('=');
      if (k.trim()) obj[k.trim()] = rest.join('=').trim();
    });
    environments[name] = obj;
    localStorage.setItem('api_envs', JSON.stringify(environments));
    currentEnv = name;
    localStorage.setItem('api_current_env', name);
    renderEnvSelect();
  }

  // ---------- UTILS ----------
  function beautify() {
    try {
      document.getElementById('body').value = JSON.stringify(JSON.parse(document.getElementById('body').value), null, 2);
      setStatus('Beautified');
    } catch (e) { setStatus('Invalid JSON', true); }
  }
  function minify() {
    try {
      document.getElementById('body').value = JSON.stringify(JSON.parse(document.getElementById('body').value));
      setStatus('Minified');
    } catch (e) { setStatus('Invalid JSON', true); }
  }
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    document.body.classList.toggle('dark', !isLight);
    document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  }
  function setStatus(msg, err = false) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status-bar ' + (err ? 'err' : 'ok');
  }

  // ---------- START ----------
  init();
  document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
