<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Online Editor 🚀</title>

  <!-- React & Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Monaco Editor -->
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/chrome.css?v=console-header">
</head>

<body class="suite suite-react">

  <header class="suite-header">
    <a class="suite-logo" href="../">js.zero2hero</a>
    <div class="suite-title"><strong>React</strong><span>Editor</span></div>
    <div class="suite-actions">
      <button type="button" class="suite-btn" data-suite-theme onclick="suiteToggleTheme()" title="Dark or light"><i class="fa-solid fa-moon"></i><span>Dark</span></button>
      <button id="run" class="suite-btn suite-btn-run" onclick="run()"><i class="fa-solid fa-play"></i> Run</button>
      <button id="format" class="suite-btn suite-btn-primary" onclick="formatCode()"><i class="fa-solid fa-wand-magic-sparkles"></i> Format</button>
      <button class="suite-btn" onclick="resetCode()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>
  </header>

  <div class="container">
    <div class="editor-workspace">
      <button type="button" class="files-rail" id="showFilesBtn" title="Show files" aria-label="Show files"><i class="fa-solid fa-folder-tree"></i><span>Files</span></button>
      <aside class="file-explorer" id="fileExplorer">
        <div class="file-explorer-head">
          <span>Files</span>
          <span class="file-explorer-tools">
            <button type="button" id="newFileBtn" title="New file" aria-label="New file"><i class="fa-solid fa-plus"></i></button>
            <button type="button" class="pane-icon" id="toggleFilesBtn" title="Hide files" aria-label="Hide files"><i class="fa-solid fa-chevron-left"></i></button>
          </span>
        </div>
        <form id="newFileForm" class="new-file-form" hidden>
          <input id="newFileInput" type="text" placeholder="src/Button.jsx" autocomplete="off" spellcheck="false" aria-label="New file path" />
        </form>
        <div id="fileTree" class="file-tree"></div>
      </aside>
      <div class="editor-column">
        <div class="editor-main">
          <div class="editor-tabs" id="editorTabs"></div>
          <div id="editor"></div>
        </div>
        <div class="pane-split pane-split-row" id="consoleSplit" role="separator" aria-orientation="horizontal" aria-label="Resize console" title="Drag to resize the console"></div>
        <div class="console-container" id="consolePanel">
          <div class="console-header">
            <span>💻 Console</span>
            <span class="console-actions">
              <button class="clear-btn" type="button" onclick="clearConsole()">Clear</button>
              <button type="button" class="pane-icon" id="toggleConsoleBtn" title="Hide console" aria-label="Hide console"><i class="fa-solid fa-chevron-down"></i></button>
            </span>
          </div>
          <div id="error"></div>
          <div id="console">> Ready to run your React code...</div>
        </div>
        <button type="button" class="pane-icon pane-text" id="showConsoleBtn" title="Show console" aria-label="Show console" hidden><i class="fa-solid fa-terminal"></i><span>Console</span></button>
      </div>
    </div>

    <div class="pane-split" id="previewSplit" role="separator" aria-orientation="vertical" aria-label="Resize preview" title="Drag to resize the preview"></div>

    <div class="preview-panel" id="previewPanel">
      <div class="panel-header">
        <span class="panel-title">👁️ Live Preview</span>
      </div>
      <div class="preview-stage">
        <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <span>React</span>
      <span>•</span>
      <span>React 18</span>
      <span>•</span>
      <span id="active-file">src/App.jsx</span>
    </div>
    <div id="status-indicator" class="status-item ready">
      <span>● Ready</span>
    </div>
  </div>

  <script src="script.js?v=preview-fill"></script>
</body>

</html>
