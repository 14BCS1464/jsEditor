<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Online Editor 🚀</title>

  <!-- React & Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Monaco Editor -->
  <script src="https://unpkg.com/monaco-editor@0.45.0/min/vs/loader.js"></script>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../shared/chrome.css">
</head>

<body class="suite suite-react">

  <header class="suite-header">
    <a class="suite-logo" href="../">js.zero2hero</a>
    <div class="suite-title"><strong>React</strong><span>Editor</span></div>
    <div class="suite-actions">
      <button id="run" class="suite-btn suite-btn-run" onclick="run()"><i class="fa-solid fa-play"></i> Run</button>
      <button id="format" class="suite-btn suite-btn-primary" onclick="formatCode()"><i class="fa-solid fa-wand-magic-sparkles"></i> Format</button>
      <button class="suite-btn" onclick="resetCode()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>
  </header>

  <div class="container">




    <!-- <div class="panel-header">📝 Editor - App.tsx</div> -->
    <div id="editor"></div>

    <div class="preview-panel">
      <div class="panel-header">👁️ Live Preview</div>
      <iframe id="preview" sandbox="allow-scripts allow-same-origin"></iframe>

      <div class="console-container">
        <div class="console-header">
          <span>💻 Console</span>
          <button class="clear-btn" onclick="clearConsole()">Clear</button>
        </div>
        <div id="error"></div>
        <div id="console">> Ready to run your React code...</div>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <span>React</span>
      <span>•</span>
      <span>React 18</span>
    </div>
    <div id="status-indicator" class="status-item ready">
      <span>● Ready</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
