<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5234145234173840"
        crossorigin="anonymous"></script>

    <title>Advanced Code Editor - VS Code Style</title>

    <script src="../shared/theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="../shared/chrome.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.js"></script>
</head>

<body class="suite suite-html">

    <header class="suite-header">
        <a class="suite-logo" href="../">js.zero2hero</a>
        <div class="suite-title"><strong>HTML</strong><span>Editor</span></div>
        <div class="suite-actions">
            <button type="button" class="suite-btn" data-suite-theme onclick="suiteToggleTheme()" title="Dark or light"><i class="fa-solid fa-moon"></i><span>Dark</span></button>
            <button id="run" class="suite-btn suite-btn-run" onclick="runCode()"><i class="fa-solid fa-play"></i> Run</button>
            <button id="addfile" class="suite-btn"><i class="fa-solid fa-file-import"></i> Add</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Editor Area -->
        <div class="editor-area">
            <!-- Tabs -->
            <div class="tabs-bar" id="tabsBar">
                <div class="tab active" data-file="index.html">
                    <i class="fas fa-file-code tab-icon"></i>
                    <span>index.html</span>
                    <span class="tab-close">&times;</span>
                </div>
                <div class="tab dirty" data-file="style.css">
                    <i class="fab fa-css3-alt tab-icon"></i>
                    <span>style.css</span>
                    <span class="tab-close">&times;</span>
                </div>
                <div class="tab" data-file="script.js">
                    <i class="fab fa-js tab-icon"></i>
                    <span>script.js</span>
                    <span class="tab-close">&times;</span>
                </div>
            </div>

            <!-- Code Editors -->
            <div class="editor-container">
                <div class="code-editor active" id="index.html">

                    <div class="editor-header">
                        <span>index.html</span>
                        <div class="editor-actions">
                            <button class="editor-btn" onclick="formatCode('html')">
                                <i class="fas fa-indent"></i> Format
                            </button>
                        </div>
                    </div>
                    <div class="code-area" id="htmlCode"></div>
                </div>

                <div class="code-editor" id="style.css">

                    <div class="editor-header">
                        style.css
                        <div class="editor-actions">
                            <button class="editor-btn" onclick="formatCode('css')">
                                Format
                            </button>
                        </div>
                    </div>
                    <div class="code-area" id="cssCode"></div>
                </div>

                <div class="code-editor" id="script.js">

                    <div class="editor-header">
                        script.js
                        <div class="editor-actions">
                            <button class="editor-btn" onclick="formatCode('js')">
                                Format
                            </button>
                        </div>
                    </div>
                    <div class="code-area" id="jsCode"></div>
                </div>
            </div>
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel" id="previewPanel">
            <div class="resize-handle" id="resizeHandle"></div>

            <div class="preview-frame-container">
                <div class="preview-loading" id="previewLoading">
                    <div class="spinner"></div>
                    <div>Loading Preview...</div>
                </div>
                <iframe class="preview-frame" id="previewFrame"
                    sandbox="allow-scripts allow-modals allow-same-origin"></iframe>
            </div>
        </div>
    </div>

    <!-- Bottom Panel (Terminal/Output) -->


    <!-- Status Bar -->
    <div class="status-bar">

    </div>

    <!-- Welcome Screen -->


    <script src="script.js"></script>
</body>

</html>
