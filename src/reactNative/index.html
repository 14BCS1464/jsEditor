<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Native Web Playground & Emulator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- React, ReactDOM, Babel (pinned versions from cdnjs) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

  <!-- Monaco Editor CSS (FIX: correct file name + data-name) -->
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#61dafb',
            darkBg: '#0f172a',
            panelBg: '#1e293b',
            editorBg: '#0d1117'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    /* FIX: select-none on body can block typing in Safari. Allow selection in editor areas. */
    textarea, input, #monaco-editor, #monaco-editor * {
      -webkit-user-select: text;
      user-select: text;
    }

    .monaco-editor, .monaco-editor-background, .monaco-editor .inputarea.ime-input {
      background-color: #0d1117 !important;
    }

    .emulator-screen::-webkit-scrollbar { width: 4px; }
    .emulator-screen::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 4px;
    }

    .phone-shadow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(97, 218, 251, 0.15);
    }

    .iphone-notch {
      width: 120px;
      height: 24px;
      background: #000;
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
    }

    .android-punchhole {
      width: 14px;
      height: 14px;
      background: #000;
      border-radius: 50%;
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
    }

    /* FIX: animate-spin-slow was used but never defined */
    @keyframes rn-spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: rn-spin-slow 8s linear infinite; }

    /* Placeholder color for RN TextInput */
    .rn-input::placeholder { color: var(--rn-placeholder, #94a3b8); }
  @keyframes rn-slide-up{from{transform:translateY(100%)}to{transform:none}}
    @keyframes rn-fade{from{opacity:0}to{opacity:1}}
  #phone-frame *::-webkit-scrollbar{display:none}
    #phone-frame *{scrollbar-width:none}
    @keyframes rn-shake{0%,100%{translate:0}20%{translate:-4px 2px}40%{translate:4px -2px}60%{translate:-3px -2px}80%{translate:3px 2px}}
    .rn-shake{animation:rn-shake .4s}
  </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="h-14 bg-slate-950 border-b border-slate-800 flex items-center justify-between px-4 z-20 select-none">
    <div class="flex items-center space-x-3">
      <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
        <i class="fa-brands fa-react text-xl animate-spin-slow"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm tracking-wide flex items-center gap-2">
          React Native Web <span class="text-xs bg-cyan-500/20 text-cyan-300 font-semibold px-2 py-0.5 rounded-full border border-cyan-500/30">Playground</span>
        </h1>
        <p class="text-[10px] text-slate-400">Live In-Browser Transpiler & Emulator</p>
      </div>
    </div>

    <!-- Template Selector -->
    <div class="hidden md:flex items-center space-x-2 bg-slate-900 border border-slate-800 p-1 rounded-lg text-xs">
      <span class="text-slate-400 px-2 font-medium">Templates:</span>
      <button onclick="loadTemplate('basic')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Basic UI</button>
      <button onclick="loadTemplate('counter')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Counter & State</button>
      <button onclick="loadTemplate('todo')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Todo List</button>
      <button onclick="loadTemplate('card')" class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 transition">Profile Card</button>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center space-x-2">
      <button onclick="formatCode()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-medium transition">
        <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i>
        <span class="hidden sm:inline">Format</span>
      </button>

      <button onclick="runCode()" class="flex items-center space-x-1.5 px-3.5 py-1.5 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-semibold shadow-lg shadow-cyan-900/30 transition active:scale-95">
        <i class="fa-solid fa-play text-[10px]"></i>
        <span>Run Code</span>
      </button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="flex-1 min-h-0 flex flex-col md:flex-row overflow-hidden relative">

    <!-- Left Panel: Editor & Console -->
    <section class="w-full md:w-1/2 lg:w-3/5 h-1/2 md:h-full min-h-0 flex flex-col border-r border-slate-800 bg-editorBg relative">

      <div class="h-10 shrink-0 bg-slate-950 border-b border-slate-800/80 flex items-center justify-between px-3 text-xs select-none">
        <div class="flex items-center space-x-1">
          <div class="px-3 py-1.5 rounded-t-md bg-editorBg text-cyan-400 font-mono text-xs border-t-2 border-cyan-400 flex items-center space-x-2">
            <i class="fa-brands fa-react"></i>
            <span>App.jsx</span>
          </div>
        </div>

        <div class="flex items-center space-x-3 text-slate-400">
          <span id="editor-engine" class="text-[11px] text-slate-500">Loading editor…</span>
          <span id="auto-run-indicator" class="text-[11px] flex items-center gap-1.5 text-emerald-400">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Auto-Compile Active
          </span>
          <button onclick="clearConsole()" title="Clear Console" class="hover:text-white transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>

      <!-- FIX: min-h-0 + overflow-hidden so the editor can shrink inside the flex column -->
      <div id="monaco-editor" class="flex-1 min-h-0 w-full overflow-hidden relative"></div>

      <!-- Console Dock -->
      <div id="console-dock" class="h-36 shrink-0 bg-slate-950 border-t border-slate-800 flex flex-col transition-all duration-200">
        <div class="h-8 shrink-0 bg-slate-900/80 px-3 flex items-center justify-between border-b border-slate-800/60 cursor-pointer select-none" onclick="toggleConsole()">
          <div class="flex items-center space-x-2 text-xs text-slate-300 font-medium">
            <i class="fa-solid fa-terminal text-slate-400"></i>
            <span>Console Log Terminal</span>
            <span id="log-count" class="bg-slate-800 text-slate-400 text-[10px] px-1.5 rounded-full">0</span>
          </div>
          <button class="text-slate-400 hover:text-white text-xs">
            <i id="console-toggle-icon" class="fa-solid fa-chevron-down"></i>
          </button>
        </div>

        <div id="console-logs" class="flex-1 p-2 font-mono text-xs overflow-y-auto space-y-1 text-slate-300 bg-slate-950/90">
          <div class="text-slate-500 italic text-[11px]">[System]: Console output ready...</div>
        </div>
      </div>
    </section>

    <!-- Right Panel: Device Emulator -->
    <section class="w-full md:w-1/2 lg:w-2/5 h-1/2 md:h-full min-h-0 bg-slate-900 flex flex-col items-center justify-between p-4 relative overflow-hidden">

      <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px] opacity-30 pointer-events-none"></div>

      <div class="w-full max-w-sm flex items-center justify-between bg-slate-950/80 backdrop-blur border border-slate-800 p-2 rounded-xl z-10 mb-2 shadow-lg text-xs text-slate-300 select-none">
        <select id="device-select" onchange="setDevice(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 outline-none"><option value="iphone15">iPhone 15 Pro</option><option value="iphonese">iPhone SE</option><option value="pixel8">Pixel 8</option><option value="ipad">iPad mini</option></select>

        <div class="flex items-center space-x-2">
          <button onclick="toggleTheme()" title="Toggle Preview Theme (Dark/Light)" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
          </button>

          <button onclick="toggleOrientation()" title="Rotate Device" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i class="fa-solid fa-rotate text-xs"></i>
          </button>

          <button onclick="runCode()" title="Reload App" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i class="fa-solid fa-arrows-rotate text-xs"></i>
          </button>
        </div>
      </div>

      <div class="flex-1 min-h-0 flex items-center justify-center w-full my-auto z-10">
        <div id="phone-wrap" style="position:relative;width:360px;height:640px"><div id="phone-frame" class="absolute transition-all duration-300 ease-out bg-black border-[10px] border-slate-800 rounded-[48px] phone-shadow flex flex-col overflow-hidden select-none" style="left:0;top:0;transform-origin:top left;width:360px;height:640px;">

          <div id="modal-root" style="position:absolute;top:32px;left:0;right:0;bottom:20px;z-index:45;pointer-events:none;overflow:hidden"></div>
          <div id="phone-notch" class="iphone-notch flex items-center justify-center">
            <div class="w-12 h-1 bg-slate-900 rounded-full"></div>
          </div>

          <div id="status-bar" class="h-8 shrink-0 px-6 pt-1 flex items-center justify-between text-[10px] font-semibold text-slate-400 z-40">
            <span id="status-time">9:41</span>
            <div class="flex items-center space-x-1.5">
              <i class="fa-solid fa-signal text-[9px]"></i>
              <i class="fa-solid fa-wifi text-[9px]"></i>
              <i class="fa-solid fa-battery-full text-xs"></i>
            </div>
          </div>

          <!-- FIX: explicit light colors (text no longer inherits near-white from <html>) -->
          <div id="emulator-screen" class="emulator-screen flex-1 min-h-0 overflow-y-auto relative w-full flex flex-col" style="background-color:#ffffff;color:#0f172a;">
            <div id="app-root" class="w-full min-h-full flex flex-col"></div>
          </div>

          <div id="kb-panel" style="display:none;flex-direction:column;gap:8px;padding:8px 4px;background:#d1d5db;color:#111827;flex-shrink:0;z-index:40"></div>
          <div id="home-indicator-container" class="h-5 shrink-0 w-full flex items-center justify-center bg-transparent z-40">
            <div id="home-indicator" class="w-32 h-1 bg-slate-400/50 rounded-full"></div>
          </div>

        </div></div>
      </div>

      <div class="z-10 text-[11px] text-slate-500 font-mono flex items-center gap-2">
        <span id="resolution-display">340 x 620 px</span>
        <span>•</span>
        <span>React Native Web Engine v0.19</span>
      </div>

    </section>

  </main>

  <!-- Monaco AMD loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>

  <script>
    // ==========================================
    // 0. SMALL HELPERS + CONSOLE (installed first)
    // ==========================================
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const safeStringify = (v) => {
      try { return JSON.stringify(v, null, 2); } catch (e) { return String(v); }
    };

    const formatConsoleArgs = (args) => {
      let list = [...args];
      if (typeof list[0] === 'string' && /%[sdifoOjc]/.test(list[0])) {
        const first = list.shift();
        const replaced = first.replace(/%[sdifoOjc]/g, (m) => {
          if (!list.length) return m;
          const v = list.shift();
          if (m === '%c') return '';
          return typeof v === 'object' && v !== null ? safeStringify(v) : String(v);
        });
        list = [replaced, ...list];
      }
      return list.map((a) => {
        if (a instanceof Error) return a.message;
        if (typeof a === 'object' && a !== null) return safeStringify(a);
        return String(a);
      }).join(' ');
    };

    // FIX: console is intercepted immediately (was window.onload, so early logs/errors were lost)
    const installConsole = () => {
      const logContainer = document.getElementById('console-logs');
      const logCountBadge = document.getElementById('log-count');
      let count = 0;
      const original = { log: console.log, warn: console.warn, error: console.error, info: console.info };

      const appendLog = (type, args) => {
        count++;
        logCountBadge.innerText = count;

        let color = 'text-slate-300';
        let icon = 'fa-circle-info text-cyan-400';
        if (type === 'error') { color = 'text-rose-400'; icon = 'fa-circle-xmark text-rose-500'; }
        else if (type === 'warn') { color = 'text-amber-300'; icon = 'fa-triangle-exclamation text-amber-400'; }

        const item = document.createElement('div');
        item.className = 'flex items-start gap-2 border-b border-slate-900/50 pb-1';

        const i = document.createElement('i');
        i.className = `fa-solid ${icon} text-[10px] mt-1`;

        // FIX: textContent instead of innerHTML so messages can't break the layout
        const span = document.createElement('span');
        span.className = `${color} flex-1 break-all whitespace-pre-wrap`;
        span.textContent = formatConsoleArgs(args);

        item.appendChild(i);
        item.appendChild(span);
        logContainer.appendChild(item);
        logContainer.scrollTop = logContainer.scrollHeight;
      };

      ['log', 'info', 'warn', 'error'].forEach((method) => {
        console[method] = (...args) => {
          try { original[method].apply(console, args); } catch (e) {}
          appendLog(method === 'info' ? 'log' : method, args);
        };
      });

      window.addEventListener('error', (e) => appendLog('error', [e.message || 'Script error']));
      window.addEventListener('unhandledrejection', (e) => appendLog('error', ['Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]));
    };
    installConsole();

    // ==========================================
    // 1. REACT NATIVE WEB PRIMITIVES SYSTEM
    // ==========================================
    const createRNPrimitives = () => {
      const React = window.React;

      const hexToRgba = (color, opacity) => {
        if (typeof color !== 'string' || color[0] !== '#') return color;
        let hex = color.slice(1);
        if (hex.length === 3) hex = hex.split('').map((c) => c + c).join('');
        const n = parseInt(hex.slice(0, 6), 16);
        if (isNaN(n)) return color;
        return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${opacity})`;
      };

      // Convert RN style objects into valid web CSS
      const processStyles = (styleObj) => {
        if (!styleObj) return {};
        if (Array.isArray(styleObj)) {
          return styleObj.reduce((acc, curr) => ({ ...acc, ...processStyles(curr) }), {});
        }
        if (typeof styleObj !== 'object') return {};

        const css = { ...styleObj };
        const has = (k) => css[k] !== undefined && css[k] !== null;

        const expand = (key, targets) => {
          if (!has(key)) return;
          targets.forEach((t) => { if (!has(t)) css[t] = css[key]; });
          delete css[key];
        };
        expand('marginVertical', ['marginTop', 'marginBottom']);
        expand('marginHorizontal', ['marginLeft', 'marginRight']);
        expand('paddingVertical', ['paddingTop', 'paddingBottom']);
        expand('paddingHorizontal', ['paddingLeft', 'paddingRight']);

        // FIX: unitless lineHeight means "multiplier" on web but "pixels" in RN
        if (typeof css.lineHeight === 'number') css.lineHeight = `${css.lineHeight}px`;

        // FIX: textDecorationLine is not a CSS property on web
        if (has('textDecorationLine')) {
          if (!has('textDecoration')) css.textDecoration = css.textDecorationLine;
          delete css.textDecorationLine;
        }

        // FIX: RN shadow props -> CSS box-shadow
        if (has('shadowColor') || has('shadowRadius') || has('shadowOffset') || has('shadowOpacity')) {
          if (!has('boxShadow')) {
            const o = css.shadowOffset || { width: 0, height: 0 };
            const op = has('shadowOpacity') ? css.shadowOpacity : 1;
            css.boxShadow = `${o.width || 0}px ${o.height || 0}px ${css.shadowRadius || 0}px ${hexToRgba(css.shadowColor || '#000000', op)}`;
          }
        }
        ['shadowColor', 'shadowOffset', 'shadowOpacity', 'shadowRadius', 'elevation'].forEach((k) => delete css[k]);

        // RN transform arrays -> CSS transform string
        if (Array.isArray(css.transform)) {
          css.transform = css.transform.map((t) =>
            Object.entries(t).map(([k, v]) => {
              const needsPx = typeof v === 'number' && !/scale|rotate|skew/.test(k);
              return `${k}(${needsPx ? v + 'px' : v})`;
            }).join(' ')
          ).join(' ');
        }

        return css;
      };

      // Only pass props that make sense on a DOM node (avoids "unknown prop" warnings)
      const DOM_PROPS = new Set(['id', 'className', 'role', 'title', 'tabIndex', 'onClick', 'onScroll', 'onMouseEnter', 'onMouseLeave', 'onFocus', 'onBlur', 'onKeyDown', 'onKeyUp', 'onMouseDown', 'onMouseMove', 'onMouseUp', 'onTouchStart', 'onTouchMove', 'onTouchEnd']);
      const domProps = (props) => {
        const out = {};
        Object.keys(props).forEach((k) => {
          if (DOM_PROPS.has(k) || k.startsWith('data-') || k.startsWith('aria-')) out[k] = props[k];
        });
        if (props.testID) out['data-testid'] = props.testID;
        return out;
      };

      const View = React.forwardRef(({ style, children, pointerEvents, ...props }, ref) => {
        const baseStyle = {
          display: 'flex',
          flexDirection: 'column',
          boxSizing: 'border-box',
          position: 'relative',
          borderWidth: 0,
          borderStyle: 'solid',
          minWidth: 0,
          minHeight: 0
        };
        const extra = pointerEvents ? { pointerEvents: pointerEvents === 'box-none' ? 'none' : pointerEvents } : {};
        return React.createElement('div', {
          ref,
          style: { ...baseStyle, ...extra, ...processStyles(style) },
          ...domProps(props)
        }, children);
      });

      const Text = React.forwardRef(({ style, children, numberOfLines, onPress, ...props }, ref) => {
        const baseStyle = {
          display: 'inline',
          boxSizing: 'border-box',
          color: 'inherit',
          fontFamily: 'Inter, system-ui, sans-serif'
        };

        let truncateStyle = {};
        if (numberOfLines) {
          truncateStyle = {
            display: '-webkit-box',
            WebkitLineClamp: numberOfLines,
            WebkitBoxOrient: 'vertical',
            overflow: 'hidden'
          };
        }

        const dom = domProps(props);
        if (onPress) { dom.onClick = onPress; truncateStyle.cursor = 'pointer'; }

        return React.createElement('span', {
          ref,
          style: { ...baseStyle, ...processStyles(style), ...truncateStyle },
          ...dom
        }, children);
      });

      const TouchableOpacity = React.forwardRef(({ style, children, onPress, activeOpacity = 0.7, disabled, ...props }, ref) => {
        const [isPressed, setIsPressed] = React.useState(false);
        return React.createElement('div', {
          ref,
          onClick: disabled ? undefined : onPress,
          onMouseDown: () => setIsPressed(true),
          onMouseUp: () => setIsPressed(false),
          onMouseLeave: () => setIsPressed(false),
          onTouchStart: () => setIsPressed(true),
          onTouchEnd: () => setIsPressed(false),
          style: {
            display: 'flex',
            flexDirection: 'column',
            boxSizing: 'border-box',
            cursor: disabled ? 'default' : 'pointer',
            userSelect: 'none',
            transition: 'opacity 0.15s ease',
            opacity: isPressed && !disabled ? activeOpacity : (disabled ? 0.5 : 1),
            borderWidth: 0,
            borderStyle: 'solid',
            ...processStyles(style)
          },
          ...domProps(props)
        }, children);
      });

      const Pressable = React.forwardRef(({ style, children, onPress, disabled, ...props }, ref) => {
        const [pressed, setPressed] = React.useState(false);
        const computedStyle = typeof style === 'function' ? style({ pressed }) : style;
        return React.createElement('div', {
          ref,
          onClick: disabled ? undefined : onPress,
          onMouseDown: () => setPressed(true),
          onMouseUp: () => setPressed(false),
          onMouseLeave: () => setPressed(false),
          onTouchStart: () => setPressed(true),
          onTouchEnd: () => setPressed(false),
          style: {
            display: 'flex',
            flexDirection: 'column',
            boxSizing: 'border-box',
            cursor: 'pointer',
            userSelect: 'none',
            borderWidth: 0,
            borderStyle: 'solid',
            ...processStyles(computedStyle)
          },
          ...domProps(props)
        }, typeof children === 'function' ? children({ pressed }) : children);
      });

      const ScrollView = React.forwardRef(({ style, contentContainerStyle, children, horizontal, ...props }, ref) => {
        return React.createElement('div', {
          ref,
          style: {
            display: 'flex',
            flexDirection: horizontal ? 'row' : 'column',
            overflowX: horizontal ? 'auto' : 'hidden',
            overflowY: horizontal ? 'hidden' : 'auto',
            flex: 1,
            minHeight: 0,
            boxSizing: 'border-box',
            ...processStyles(style)
          },
          ...domProps(props)
        }, React.createElement('div', {
          style: {
            display: 'flex',
            flexDirection: horizontal ? 'row' : 'column',
            minWidth: horizontal ? 'max-content' : '100%',
            boxSizing: 'border-box',
            ...processStyles(contentContainerStyle)
          }
        }, children));
      });

      const renderMaybe = (c) => (c ? (React.isValidElement(c) ? c : React.createElement(c)) : null);

      const FlatList = ({ data = [], renderItem, keyExtractor, style, contentContainerStyle, horizontal, ListHeaderComponent, ListFooterComponent, ListEmptyComponent, ItemSeparatorComponent, ...props }) => {
        const children = [];

    function createFallbackEditor() {

      notch.innerHTML = '';
      const base = 'position:absolute;left:50%;transform:translateX(-50%);background:#000;z-index:50;';
      if (d.type === 'island' && !land) notch.style.cssText = base + 'top:8px;width:100px;height:28px;border-radius:16px;';
      else if (d.type === 'punch') notch.style.cssText = base + 'top:9px;width:14px;height:14px;border-radius:50%;';
      else notch.style.cssText = 'display:none';
      const sb = document.getElementById('status-bar');
      sb.style.height = d.sb + 'px';
      sb.style.paddingTop = d.type === 'island' ? '14px' : '2px';
      document.getElementById('modal-root').style.top = d.sb + 'px';
      document.getElementById('resolution-display').innerText = d.n + ' • ' + w + ' x ' + h;
      const ios = d.os === 'iphone';
      frame.style.borderColor = '#18181b';
      frame.style.boxShadow = '0 0 0 2px #52525b, 0 25px 50px -12px rgba(0,0,0,.7), 0 0 30px rgba(97,218,251,.12)';
      sb.style.fontSize = ios ? '15px' : '13px';
      sb.style.paddingLeft = sb.style.paddingRight = ios ? '30px' : '18px';
      sb.querySelectorAll('i').forEach((i) => { i.style.fontSize = ios ? '13px' : '12px'; });
      fitDevice();
      paintStatusBar();
    }

    function fitDevice() {
      const frame = document.getElementById('phone-frame');
      const wrap = document.getElementById('phone-wrap');
      const area = wrap.parentElement;
      const fw = parseFloat(frame.style.width), fh = parseFloat(frame.style.height);
      const s = Math.max(0.1, Math.min(1, (area.clientWidth - 8) / fw, (area.clientHeight - 8) / fh));
      window.__deviceScale = s;
      frame.style.transform = 'scale(' + s + ')';
      wrap.style.width = fw * s + 'px';
      wrap.style.height = fh * s + 'px';
    }

    function setDevice(key) {
      deviceKey = DEVICES[key] ? key : 'iphone15';
      applyDevice();
      runCode(); // re-run so Platform.OS and Dimensions update
    }

    function toggleOrientation() {
      currentOrientation = currentOrientation === 'portrait' ? 'landscape' : 'portrait';
      applyDevice();
      setTimeout(runCode, 350);
    }

    // FIX: "dark:" classes don't apply to the same element that has .dark, so set colors directly
    function toggleTheme() {
      const screen = document.getElementById('emulator-screen');
      const icon = document.getElementById('theme-icon');

      isDarkPreview = !isDarkPreview;
      if (window.rnAppearance) window.rnAppearance.set(isDarkPreview ? 'dark' : 'light');
      setTimeout(paintStatusBar, 0);
      const kbp = document.getElementById('kb-panel'); kbp.style.background = isDarkPreview ? '#1f2937' : '#d1d5db'; kbp.style.color = isDarkPreview ? '#f1f5f9' : '#111827';
      if (isDarkPreview) {
        screen.style.backgroundColor = '#020617';
        screen.style.color = '#f1f5f9';
        icon.className = 'fa-solid fa-sun text-xs text-amber-400';
      } else {
        screen.style.backgroundColor = '#ffffff';
        screen.style.color = '#0f172a';
        icon.className = 'fa-solid fa-moon text-xs';
      }
    }

    // ---------- Status bar that follows the app's background ----------
    let sbOverride = null;
    function setStatusBar(o) { sbOverride = o; paintStatusBar(); }
    window.setStatusBar = setStatusBar;

    function paintStatusBar() {
      const sb = document.getElementById('status-bar');
      const screen = document.getElementById('emulator-screen');
      const hic = document.getElementById('home-indicator-container');
      const hi = document.getElementById('home-indicator');
      if (!sb || !screen) return;
      const o = sbOverride || {};
      let bg = o.backgroundColor || null;
      if (!bg) {
        const first = document.getElementById('app-root').firstElementChild;
        const c = first ? getComputedStyle(first).backgroundColor : '';
        if (c && !/rgba\(.*,\s*0\)|transparent/.test(c)) bg = c;
      }
      bg = bg || screen.style.backgroundColor;
      let light;
      if (o.barStyle === 'light-content' || o.style === 'light') light = true;
      else if (o.barStyle === 'dark-content' || o.style === 'dark') light = false;
      else {
        const m = (bg.match(/[\d.]+/g) || [255, 255, 255]).map(Number);
        light = (0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2]) < 140;
      }
      sb.style.background = bg;
      sb.style.color = light ? '#ffffff' : '#0f172a';
      hic.style.background = bg;
      hi.style.background = light ? 'rgba(255,255,255,.6)' : 'rgba(0,0,0,.45)';
      hi.style.display = deviceKey === 'iphonese' ? 'none' : '';
    }

    // ---------- Native-looking Alert ----------
    window.showNativeAlert = (title, message, buttons) => {
      console.log('[Alert] ' + title + (message ? ': ' + message : ''));
      const root = document.getElementById('modal-root');
      const ios = currentDevice === 'iphone', dark = isDarkPreview;
      const btns = buttons && buttons.length ? buttons : [{ text: 'OK' }];
      const line = 'rgba(128,128,128,.35)';
      const ov = document.createElement('div');
      ov.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;pointer-events:auto;animation:rn-fade .15s;z-index:5';
      const box = document.createElement('div');
      box.style.cssText = 'width:' + (ios ? 270 : 280) + 'px;background:' + (dark ? '#2c2c2e' : '#fff') + ';color:' + (dark ? '#fff' : '#111') + ';border-radius:' + (ios ? 14 : 28) + 'px;overflow:hidden;font-family:Inter,sans-serif;' + (ios ? 'text-align:center;' : 'padding:24px 24px 8px;box-shadow:0 8px 24px rgba(0,0,0,.4);');
      const head = document.createElement('div');
      head.style.cssText = ios ? 'padding:18px 16px 14px' : 'padding:0 0 16px';
      head.innerHTML = '<div style="font-weight:600;font-size:' + (ios ? 17 : 22) + 'px">' + escapeHtml(title) + '</div>' + (message ? '<div style="font-size:' + (ios ? 13 : 14) + 'px;margin-top:4px;opacity:.85">' + escapeHtml(message) + '</div>' : '');
      box.appendChild(head);
      const row = document.createElement('div');
      row.style.cssText = ios ? 'display:flex;' + (btns.length > 2 ? 'flex-direction:column;' : '') + 'border-top:1px solid ' + line : 'display:flex;justify-content:flex-end;gap:8px;padding-bottom:8px';
      btns.forEach((b, i) => {
        const el = document.createElement('div');
        el.textContent = b.text;
        const red = b.style === 'destructive', bold = b.style === 'cancel';
        el.style.cssText = ios
          ? 'flex:1;padding:12px;font-size:17px;cursor:pointer;color:' + (red ? '#ff3b30' : '#0a84ff') + ';font-weight:' + (bold ? 600 : 400) + ';' + (i > 0 ? (btns.length <= 2 ? 'border-left' : 'border-top') + ':1px solid ' + line : '')
          : 'padding:10px 12px;font-size:14px;font-weight:500;cursor:pointer;color:' + (red ? '#ef4444' : '#6750a4');
        el.onclick = () => { ov.remove(); b.onPress && b.onPress(); };
        row.appendChild(el);
      });
      box.appendChild(row);
      ov.appendChild(box);
      root.appendChild(ov);
    };

    // ---------- Vibration shake ----------
    window.shakePhone = () => {
      const f = document.getElementById('phone-frame');
      f.classList.remove('rn-shake'); void f.offsetWidth; f.classList.add('rn-shake');
    };

    // ---------- Touch simulation: finger dot, drag-to-scroll with momentum ----------
    (function touchSim() {
      const frame = document.getElementById('phone-frame'), screen = document.getElementById('emulator-screen');
      const dot = document.createElement('div');
      dot.style.cssText = 'position:absolute;width:38px;height:38px;border-radius:50%;background:rgba(140,140,140,.35);border:2px solid rgba(255,255,255,.65);pointer-events:none;z-index:60;display:none;transform:translate(-50%,-50%)';
      frame.appendChild(dot);
      const scale = () => window.__deviceScale || 1;
      const pos = (e) => { const r = frame.getBoundingClientRect(); dot.style.left = ((e.clientX - r.left) / scale()) + 'px'; dot.style.top = ((e.clientY - r.top) / scale()) + 'px'; };
      const scrollable = (el) => {
        while (el && el !== frame) {
          const cs = getComputedStyle(el);
          if (/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1) return { el, axis: 'y' };
          if (/(auto|scroll)/.test(cs.overflowX) && el.scrollWidth > el.clientWidth + 1) return { el, axis: 'x' };
          el = el.parentElement;
        }
        return null;
      };
      let drag = null, suppress = false;
      frame.addEventListener('mousedown', (e) => {
        if (e.button) return;
        dot.style.display = 'block'; pos(e);
        const field = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
        if (screen.contains(e.target) && !field) drag = { sc: scrollable(e.target), x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, v: 0 };
      });
      window.addEventListener('mousemove', (e) => {
        if (dot.style.display === 'none') return;
        pos(e);
        if (!drag) return;
        if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) { drag.moved = true; getSelection().removeAllRanges(); }
        if (drag.moved && drag.sc) {
          const dx = (e.clientX - drag.lx) / scale(), dy = (e.clientY - drag.ly) / scale();
          if (drag.sc.axis === 'y') { drag.sc.el.scrollTop -= dy; drag.v = -dy; } else { drag.sc.el.scrollLeft -= dx; drag.v = -dx; }
        }
        drag.lx = e.clientX; drag.ly = e.clientY;
      });
      window.addEventListener('mouseup', () => {
        dot.style.display = 'none';
        if (!drag) return;
        const d = drag; drag = null;
        if (!d.moved) return;
        suppress = true; setTimeout(() => { suppress = false; }, 0);
        if (d.sc) {
          let v = d.v;
          const f = () => { v *= 0.95; if (Math.abs(v) < 0.3) return; if (d.sc.axis === 'y') d.sc.el.scrollTop += v; else d.sc.el.scrollLeft += v; requestAnimationFrame(f); };
          f();
        }
      });
      frame.addEventListener('click', (e) => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
    })();

    setInterval(paintStatusBar, 800);

    applyDevice();
    new ResizeObserver(fitDevice).observe(document.getElementById('phone-wrap').parentElement);

    // Status bar clock
    setInterval(() => {
      const now = new Date();
      document.getElementById('status-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }, 1000);
  </script>
</body>
