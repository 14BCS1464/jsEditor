<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Native Playground & Emulator</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">

  <!-- React, ReactDOM, Babel (pinned versions from cdnjs) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

  <!-- Monaco Editor CSS (FIX: correct file name + data-name) -->
  <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/editor/editor.main.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#61dafb',
            darkBg: '#0f172a',
            panelBg: '#1e293b',
            editorBg: '#0d1117'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace']
          }
        }
      }
    }
  </script>

  <script>
    try {
      if (!localStorage.getItem('suite-theme') && localStorage.getItem('rn-ui') === 'dark') localStorage.setItem('suite-theme', 'dark');
      if (localStorage.getItem('suite-theme') === 'dark') delete document.documentElement.dataset.ui;
      else document.documentElement.dataset.ui = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="simulator.css">
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../shared/chrome.css">
  <style>
    /* FIX: select-none on body can block typing in Safari. Allow selection in editor areas. */
    textarea, input, #monaco-editor, #monaco-editor * {
      -webkit-user-select: text;
      user-select: text;
    }

    .monaco-editor, .monaco-editor-background, .monaco-editor .inputarea.ime-input {
      background-color: #0d1117 !important;
    }

    @keyframes rn-spin-slow { to { transform: rotate(360deg); } }
    .animate-spin-slow { animation: rn-spin-slow 8s linear infinite; }

    .playground {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .editor-pane,
    .sim-pane {
      min-width: 0;
      min-height: 0;
    }

    .editor-pane { flex: 1 1 46%; }
    .sim-pane { flex: 1 1 54%; }

    .split-handle,
    .console-resize {
      flex: 0 0 7px;
      position: relative;
      z-index: 6;
      background: #1e293b;
      touch-action: none;
    }

    .split-handle { cursor: row-resize; }
    .console-resize { cursor: row-resize; }

    .split-handle::after,
    .console-resize::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 3px;
      border-radius: 99px;
      background: #64748b;
      transform: translate(-50%, -50%);
    }

    .split-handle:hover,
    .console-resize:hover,
    .split-handle.dragging,
    .console-resize.dragging {
      background: #334155;
    }

    html[data-ui="light"] body { background: #f4f6f8; color: #111827; }
    html[data-ui="light"] header { background: #ffffff !important; border-color: #e5e7eb !important; color: #111827; }
    html[data-ui="light"] header p,
    html[data-ui="light"] .text-slate-400,
    html[data-ui="light"] .text-slate-500 { color: #64748b !important; }
    html[data-ui="light"] .text-slate-300 { color: #334155 !important; }
    html[data-ui="light"] header .bg-slate-800,
    html[data-ui="light"] .sim-pane .bg-slate-800 {
      background: #f1f5f9 !important;
      color: #334155 !important;
      border-color: #e2e8f0 !important;
    }
    html[data-ui="light"] .editor-pane { background: #ffffff !important; border-color: #e5e7eb !important; }
    html[data-ui="light"] .editor-pane .bg-slate-950,
    html[data-ui="light"] .editor-pane .bg-editorBg,
    html[data-ui="light"] .editor-pane .bg-slate-900\/80 { background: #ffffff !important; border-color: #e5e7eb !important; }
    html[data-ui="light"] #console-dock,
    html[data-ui="light"] #console-logs { background: #f8fafc !important; color: #334155 !important; border-color: #e5e7eb !important; }
    html[data-ui="light"] #log-count { background: #e2e8f0 !important; color: #475569 !important; }
    html[data-ui="light"] .sim-pane { background: #e7edf3 !important; }
    html[data-ui="light"] .sim-pane .bg-slate-950\/80 { background: rgba(255,255,255,.92) !important; border-color: #e5e7eb !important; }
    html[data-ui="light"] .sim-pane select { background: #f8fafc !important; color: #0f172a !important; border-color: #e2e8f0 !important; }
    html[data-ui="light"] .split-handle,
    html[data-ui="light"] .console-resize { background: #d5dde6; }
    html[data-ui="light"] .split-handle:hover,
    html[data-ui="light"] .console-resize:hover { background: #c5d0dc; }
    html[data-ui="light"] .monaco-editor,
    html[data-ui="light"] .monaco-editor-background,
    html[data-ui="light"] .monaco-editor .margin { background-color: #ffffff !important; }

    @media (min-width: 980px) {
      .playground { flex-direction: row; }
      .editor-pane { flex: 1.25 1 0; }
      .sim-pane { flex: 0.85 1 0; width: auto; }
      .split-handle { cursor: col-resize; flex-basis: 7px; }
      .split-handle::after { width: 3px; height: 28px; }
    }
  </style>
</head>
<body class="suite suite-rn h-full flex flex-col font-sans overflow-hidden">

  <header class="suite-header">
    <a class="suite-logo" href="../">js.zero2hero</a>
    <div class="suite-title"><strong>React Native</strong><span>Playground</span></div>
    <div class="suite-actions">
      <button id="ui-theme" type="button" class="suite-btn" data-suite-theme onclick="suiteToggleTheme()" title="Dark or light">
        <i id="ui-theme-icon" class="fa-solid fa-moon"></i>
        <span>Dark</span>
      </button>
      <button class="suite-btn suite-btn-primary" onclick="formatCode()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Format
      </button>
      <button class="suite-btn suite-btn-run" onclick="runCode(true)">
        <i class="fa-solid fa-play"></i> Run
      </button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="playground overflow-hidden relative">

    <!-- Left Panel: Editor & Console -->
    <section class="editor-pane h-1/2 md:h-full min-h-0 flex flex-col border-r border-slate-800 bg-editorBg relative">

      <div class="h-10 shrink-0 bg-slate-950 border-b border-slate-800/80 flex items-center justify-between px-3 text-xs select-none">
        <div class="flex items-center space-x-1">
          <div class="px-3 py-1.5 rounded-t-md bg-editorBg text-cyan-400 font-mono text-xs border-t-2 border-cyan-400 flex items-center space-x-2">
            <i class="fa-brands fa-react"></i>
            <span>App.jsx</span>
          </div>
        </div>

        <div class="flex items-center space-x-3 text-slate-400 min-w-0">
          <span id="editor-engine" class="text-[11px] text-slate-500 shrink-0">Loading editor…</span>
          <span id="auto-run-indicator" class="text-[11px] flex items-center gap-1.5 text-emerald-400 min-w-0 truncate">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span> Auto-Compile Active
          </span>
          <button onclick="clearConsole()" title="Clear Console" class="hover:text-white transition">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        </div>
      </div>

      <!-- FIX: min-h-0 + overflow-hidden so the editor can shrink inside the flex column -->
      <div id="monaco-editor" class="flex-1 min-h-0 w-full overflow-hidden relative"></div>

      <!-- Console Dock -->
      <div id="console-dock" class="h-36 shrink-0 bg-slate-950 border-t border-slate-800 flex flex-col">
        <div id="console-resize" class="console-resize" role="separator" aria-orientation="horizontal" aria-label="Resize terminal" title="Drag to resize the terminal"></div>
        <div class="h-8 shrink-0 bg-slate-900/80 px-3 flex items-center justify-between border-b border-slate-800/60 cursor-pointer select-none" onclick="toggleConsole()">
          <div class="flex items-center space-x-2 text-xs text-slate-300 font-medium">
            <i class="fa-solid fa-terminal text-slate-400"></i>
            <span>Console Log Terminal</span>
            <span id="log-count" class="bg-slate-800 text-slate-400 text-[10px] px-1.5 rounded-full">0</span>
          </div>
          <button class="text-slate-400 hover:text-white text-xs">
            <i id="console-toggle-icon" class="fa-solid fa-chevron-down"></i>
          </button>
        </div>

        <div id="console-logs" class="flex-1 p-2 font-mono text-xs overflow-y-auto space-y-1 text-slate-300 bg-slate-950/90">
          <div class="text-slate-500 italic text-[11px]">[System]: Console output ready...</div>
        </div>
      </div>
    </section>

    <div id="split-handle" class="split-handle" role="separator" aria-orientation="vertical" aria-label="Resize device" title="Drag to resize the device"></div>

    <!-- Right Panel: Device Emulator -->
    <section class="sim-pane h-1/2 md:h-full min-h-0 bg-slate-900 flex flex-col items-center justify-between p-4 relative overflow-hidden">

      <div class="absolute inset-0 bg-[radial-gradient(#334155_1px,transparent_1px)] [background-size:16px_16px] opacity-30 pointer-events-none"></div>

      <div class="w-full max-w-lg flex items-center justify-between gap-2 bg-slate-950/80 backdrop-blur border border-slate-800 p-2 rounded-xl z-10 mb-2 shadow-lg text-xs text-slate-300 select-none">
        <select id="device-select" onchange="setDevice(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1 outline-none">
            <optgroup label="iPhone">
              <option value="iphone16promax">iPhone 16 Pro Max</option>
              <option value="iphone16pro">iPhone 16 Pro</option>
              <option value="iphone16">iPhone 16</option>
              <option value="iphone15promax">iPhone 15 Pro Max</option>
              <option value="iphone15pro" selected>iPhone 15 Pro</option>
              <option value="iphone15">iPhone 15</option>
              <option value="iphone14pro">iPhone 14 Pro</option>
              <option value="iphone14">iPhone 14</option>
              <option value="iphone13">iPhone 13</option>
              <option value="iphone13mini">iPhone 13 mini</option>
              <option value="iphonese">iPhone SE</option>
            </optgroup>
            <optgroup label="Android">
              <option value="galaxys25ultra">Galaxy S25 Ultra</option>
              <option value="galaxys25">Galaxy S25</option>
              <option value="galaxys24ultra">Galaxy S24 Ultra</option>
              <option value="galaxys24">Galaxy S24</option>
              <option value="pixel9">Pixel 9</option>
              <option value="pixel9pro">Pixel 9 Pro</option>
              <option value="pixel8">Pixel 8</option>
              <option value="pixel8pro">Pixel 8 Pro</option>
            </optgroup>
            <optgroup label="iPad">
              <option value="ipadmini">iPad mini</option>
              <option value="ipadpro11">iPad Pro 11"</option>
              <option value="ipadair">iPad Air</option>
            </optgroup>
            <optgroup label="Tablet">
              <option value="galaxytabs9">Galaxy Tab S9</option>
              <option value="pixeltablet">Pixel Tablet</option>
            </optgroup>
          </select>
        <div class="flex items-center space-x-2">
          <button onclick="goHome()" title="Home" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i class="fa-solid fa-house text-xs"></i>
          </button>

          <button onclick="toggleTheme()" title="Toggle Preview Theme (Dark/Light)" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
          </button>

          <button onclick="toggleOrientation()" title="Rotate Device" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i class="fa-solid fa-rotate text-xs"></i>
          </button>

          <button onclick="runCode()" title="Reload App" class="w-7 h-7 rounded-md bg-slate-800 hover:bg-slate-700 flex items-center justify-center text-slate-300 transition">
            <i class="fa-solid fa-arrows-rotate text-xs"></i>
          </button>
        </div>
      </div>

      <div class="flex-1 min-h-0 flex items-center justify-center w-full my-auto z-10">
        <div id="phone-wrap" style="position:relative;width:360px;height:640px">
            <div id="phone-frame" class="transition-all duration-300 ease-out bg-black border-[10px] border-slate-800 rounded-[48px] phone-shadow flex flex-col overflow-hidden select-none" style="left:0;top:0;transform-origin:top left;width:360px;height:640px;">
          <div id="modal-root" style="position:absolute;top:32px;left:0;right:0;bottom:20px;z-index:45;pointer-events:none;overflow:hidden"></div>
          <div id="phone-notch" style="display:none;pointer-events:none;"></div>

          <div id="status-bar" class="shrink-0 z-40">
            <span id="status-time">9:41</span>
            <span id="status-cutout-space"></span>
            <div id="status-icons">
              <i class="fa-solid fa-signal"></i>
              <i class="fa-solid fa-wifi"></i>
              <span id="battery-wrap" title="Battery">
                <i id="battery-icon" class="fa-solid fa-battery-full"></i>
                <i id="battery-bolt" class="fa-solid fa-bolt"></i>
              </span>
            </div>
          </div>

          <div id="emulator-screen" class="emulator-screen flex-1 min-h-0 overflow-hidden relative w-full" style="background-color:#ffffff;color:#0f172a;">
            <div id="os-home"></div>
            <div id="os-system"></div>
            <div id="app-root"></div>
          </div>

          <div id="kb-panel" class="rn-kb" style="display:none"></div>
          <div id="home-indicator-container" class="shrink-0 w-full flex items-center justify-center bg-transparent z-40" onclick="goHome()" title="Home">
            <div id="home-indicator"></div>
          </div>
          <div id="android-nav">
            <button type="button" onclick="goBack()" title="Back"><i class="fa-solid fa-chevron-left"></i></button>
            <button type="button" onclick="goHome()" title="Home"><i class="fa-solid fa-circle"></i></button>
            <button type="button" onclick="goHome()" title="Recent apps"><i class="fa-regular fa-square"></i></button>
          </div>

        </div></div>
      </div>

      <div class="z-10 text-[11px] text-slate-500 font-mono flex items-center gap-2">
        <span id="resolution-display">340 x 620 px</span>
        <span>•</span>
        <span>React Native Web Engine v0.19</span>
      </div>

    </section>

  </main>

  <!-- Monaco AMD loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
  <script src="simulator.js"></script>
  <script src="examples.js"></script>
  <script src="editor.js"></script>

</body>
</html>
